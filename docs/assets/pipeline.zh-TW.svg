<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1508 558" width="1508" height="558" role="img" aria-labelledby="t d" font-family="'Segoe UI','Microsoft JhengHei','Noto Sans TC',sans-serif">
<title id="t">運作流程</title>
<desc id="d">1. 來源 → 文字模型；2. 文字模型 → 結構檢查；3. 結構檢查 → 渲染；4. 渲染 → 工程稽核頁；5. 工程稽核頁 → audience-fit；6. audience-fit → afgate 檢查；7. afgate 檢查 → 擁有者視圖</desc>
